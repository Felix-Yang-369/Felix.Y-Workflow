interface:
  display_name: "学科笔记"
  short_description: "完整检查学科笔记，补齐知识与例子并验收内容和布局"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#255CE8"
  default_prompt: "使用 $notion-note-steward 完整优化这篇学科笔记，先检查全部章节，补齐必要知识与例子，在授权范围内持续完成并验证；保留有效资源与既有格式，流程图只显示渲染图；本次授权范围内全部页面逐项验收，有缺口继续处理，最后列出实际未完成项，无剩余则写无；继承已确认要求，返工先诊断缺口，分别验收结构与内容。"

policy:
  allow_implicit_invocation: true
